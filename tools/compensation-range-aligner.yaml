name: compensation-range-aligner
version: 1.0.0
description: "Checks candidate salary expectations against budgeted compensation band"
input_schema:
  type: object
  properties:
    salary_json:
      type: string
      description: "JSON with expectation_usd, band_min, band_max"
  required:
    - salary_json
implementation:
  type: script
  path: compensation_range_aligner.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
