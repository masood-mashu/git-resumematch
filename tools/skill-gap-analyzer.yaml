name: skill-gap-analyzer
version: 1.0.0
description: "Computes overlap percentage between candidate competencies and job requirements"
input_schema:
  type: object
  properties:
    skills_json:
      type: string
      description: "JSON with candidate_skills and required_skills lists"
  required:
    - skills_json
implementation:
  type: script
  path: skill_gap_analyzer.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
