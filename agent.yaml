spec_version: "0.1.0"
name: git-resumematch
version: 1.0.0
description: "Autonomous Candidate Competency Matching, Anonymized Profile Building & Bias-Free Screening Agent"
author: "masood-mashu"
license: "Apache-2.0"

model:
  preferred: "openai:gpt-4o"
  fallback:
    - "anthropic:claude-3-5-sonnet"
    - "openai:gpt-4o-mini"
  constraints:
    temperature: 0.1
    max_tokens: 4096

skills:
  - structured-competency-evaluation
  - eeoc-bias-prevention

tools:
  - skill-gap-analyzer
  - anonymized-profile-builder
  - compensation-range-aligner

runtime:
  max_turns: 50
  timeout: 120

tags:
  - hr-recruiting
  - resume-screening
  - bias-free-hiring
  - skill-matching
  - passport-challenge

metadata:
  passport_id: "aps-resumematch-01"
  passport_category: "HR & recruiting"
